{% if messages %}
  <div class="row">
    <div class="col-12 mb-3">
      {% for msg in messages %}
        <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show d-flex align-items-center shadow-sm" role="alert">
          <i class="mdi mdi-information-outline me-2 fs-5"></i>
          <div>{{ msg }}</div>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    </div>
  </div>
{% endif %}
