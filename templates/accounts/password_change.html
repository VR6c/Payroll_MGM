{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Change Password - Payroll MGM{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-6 offset-md-3">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center mb-4 gap-3">
      <div>
        <h3 class="fw-bold text-dark mb-1"><i class="mdi mdi-key-variant text-primary me-2"></i>Change Password</h3>
        <p class="text-muted mb-0">Update your account security password</p>
      </div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="{% url 'dashboard:home' %}">Dashboard</a></li>
          <li class="breadcrumb-item text-muted">Account</li>
          <li class="breadcrumb-item active" aria-current="page">Change Password</li>
        </ol>
      </nav>
    </div>

    <div class="card">
      <div class="card-body">
        <form method="post" class="forms-sample">
          {% csrf_token %}
          {{ form|crispy }}
          <div class="mt-4 pt-3 border-top d-flex gap-2">
            <button type="submit" class="btn btn-primary text-white">
              <i class="mdi mdi-content-save me-1"></i> Update Password
            </button>
            <a href="{% url 'dashboard:home' %}" class="btn btn-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
